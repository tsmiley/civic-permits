name: CI

# The repository is public, so Actions minutes are free: every push to main and every pull request is checked, and
# the same checks can still be run by hand or locally with the commands in CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (fails on a vulnerable package)
        run: dotnet restore CivicPermits.slnx

      - name: Check formatting and style
        run: dotnet format CivicPermits.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build CivicPermits.slnx --no-restore

      # One project at a time: the browser tests start a real site and a real browser, and the others use databases.
      # The browser tests use the Chrome that GitHub's runners already have installed, so nothing is downloaded.
      - name: Test
        shell: bash
        run: |
          for project in Domain.Tests Application.Tests Infrastructure.Tests Api.IntegrationTests Web.A11yTests; do
            dotnet test "tests/CivicPermits.$project" --no-build
          done

      - name: Audit package licenses
        shell: pwsh
        run: ./scripts/license-audit.ps1
