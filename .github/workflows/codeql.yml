name: CodeQL

# Runs by hand while the repository is private. At publication it gains push, pull_request and a weekly
# schedule; CodeQL is free on public repositories.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build CivicPermits.slnx

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
